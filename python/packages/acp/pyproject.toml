[project]
name = "deft-subspace-acp"
version = "0.0.0.dev0"
description = "ACP for apps: one model over protocol v1 and v2, turns you can await, cancellation that works, permissions that fail closed. Types come from the official agent-client-protocol SDK."
keywords = ["agent-client-protocol", "acp", "agents", "llm", "asyncio", "mcp"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deft" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The kernel is released with acp, at the same version.
dependencies = ["deft-subspace-kernel==0.0.0.dev0", "agent-client-protocol>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/deftai/subspace/tree/main/python"
Source = "https://github.com/deftai/subspace"
Issues = "https://github.com/deftai/subspace/issues"
Changelog = "https://github.com/deftai/subspace/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.27"]
mcp = ["mcp>=2.3,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deft_subspace"]
