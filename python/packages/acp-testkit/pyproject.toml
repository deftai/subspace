[project]
name = "deft-subspace-acp-testkit"
version = "0.1.0a1"
description = "Test ACP agents and clients: record and replay traces, inject faults, run conformance checks and scenarios, and replay a corpus of real agents' quirks."
keywords = ["agent-client-protocol", "acp", "agents", "testing", "conformance", "asyncio"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deft" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Released with the kernel and acp, at the same version.
dependencies = ["deft-subspace-kernel==0.1.0a1", "deft-subspace-acp==0.1.0a1"]

[project.urls]
Homepage = "https://github.com/deftai/subspace/tree/main/python"
Source = "https://github.com/deftai/subspace"
Issues = "https://github.com/deftai/subspace/issues"
Changelog = "https://github.com/deftai/subspace/blob/main/python/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deft_subspace"]
