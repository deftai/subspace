[project]
name = "deft-subspace-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["deft-subspace-kernel", "deft-subspace-acp"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
deft-subspace-kernel = { workspace = true }
deft-subspace-acp = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.380", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/kernel/tests", "packages/acp/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
include = ["packages/kernel/src", "packages/acp/src"]
typeCheckingMode = "standard"
