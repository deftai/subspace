lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/acp-agent: {}

  packages/acp-client: {}

  packages/acp-probe:
    dependencies:
      '@deft/acp-client':
        specifier: workspace:*
        version: link:../acp-client
      '@deft/acp-wire':
        specifier: workspace:*
        version: link:../acp-wire

  packages/acp-wire:
    dependencies:
      '@deft/subspace-foundation':
        specifier: workspace:*
        version: link:../subspace-foundation

  packages/subspace-foundation: {}
